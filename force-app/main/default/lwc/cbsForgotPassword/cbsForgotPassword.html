<template>
    <div class="forgot-page">
        <header class="brand-header">
            <div class="brand-wrap">
                <div class="brand-logo">
                    <template if:true={showLogo}>
                        <img src={logoUrl} alt="Credit Bureau Singapore" onerror={handleLogoError} />
                    </template>
                    <template if:false={showLogo}>
                        <span class="text-logo">Credit Bureau Singapore</span>
                    </template>
                </div>
            </div>
        </header>

        <main class="forgot-main">
            <section class="left-panel">
                <div class="content-wrap">
                    <section class="forgot-card" aria-label="Reset password form">
                        <p class="eyebrow">CBS Client Portal</p>
                        <h1>Reset Your Password</h1>
                        <p class="description">
                            Enter your username or email address and we will send you instructions to reset your
                            password.
                        </p>

                        <template if:true={message}>
                            <div class={messageClass} role="status">{message}</div>
                        </template>

                        <div class="input-row">
                            <label for="usernameInput">Username</label>
                            <input
                                id="usernameInput"
                                class="username-input"
                                type="text"
                                value={username}
                                placeholder="Enter your username or email"
                                oninput={handleUsernameChange}
                                onkeydown={handleKeyDown}
                                autocomplete="username"
                                disabled={isLoading}
                            />
                        </div>

                        <div class="button-row">
                            <button
                                type="button"
                                class="continue-button"
                                onclick={handleContinue}
                                disabled={isLoading}
                            >
                                {continueButtonLabel}
                            </button>
                        </div>

                        <div class="back-row">
                            <button
                                type="button"
                                class="back-link"
                                onclick={handleCancel}
                                disabled={isLoading}
                            >
                                Back to Login
                            </button>
                        </div>
                    </section>
                </div>
            </section>

            <aside class="right-panel" aria-label="Credit Bureau Singapore brand information">
                <div class="right-inner">
                    <h2>Credit Bureau Singapore</h2>
                    <p class="promo-subtitle">
                        Secure portal for authorised client users to manage employment credit check consent and report
                        requests.
                    </p>
                    <ul class="brand-bullets">
                        <li>Consent Management</li>
                        <li>Report Request Tracking</li>
                        <li>Secure Client Access</li>
                    </ul>
                </div>
            </aside>
        </main>

        <footer class="page-footer">
            <span>© Credit Bureau (Singapore) Pte Ltd</span>
            <span>For authorised users only.</span>
        </footer>
    </div>
</template>
