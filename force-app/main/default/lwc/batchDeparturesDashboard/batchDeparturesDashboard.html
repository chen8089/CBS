<template>
    <div class="bdd-root">
        <p class="bdd-breadcrumb">Resignation Management &gt; Departures</p>

        <div class="bdd-header">
            <div class="bdd-header-left">
                <div class="bdd-header-icon-wrap" aria-hidden="true">
                    <lightning-icon icon-name="standard:contact" size="small" alternative-text=""></lightning-icon>
                </div>
                <div class="bdd-header-title-wrap">
                    <p class="bdd-subtitle">{subtitle}</p>
                    <h1 class="bdd-title">{title}</h1>
                </div>
            </div>
            <div class="bdd-header-right">
                <lightning-button
                    label="Upload Departures"
                    variant="brand"
                    onclick={handleUploadResignation}
                ></lightning-button>
            </div>
        </div>

        <div class="bdd-cards" role="list">
            <template for:each={cards} for:item="card">
                <div
                    key={card.key}
                    class={card.className}
                    data-filter={card.key}
                    role="listitem"
                    onclick={handleCardClick}
                >
                    <template if:true={card.selected}>
                        <div class="bdd-card-corner" aria-hidden="true"></div>
                    </template>
                    <div class="bdd-card-value">{card.value}</div>
                    <div class="bdd-card-label">{card.label}</div>
                </div>
            </template>
        </div>

        <div class="bdd-panel">
            <div class="bdd-panel-header">
                <div>
                    <h2 class="bdd-panel-title">{tableTitle}</h2>
                    <p class="bdd-panel-subtitle">{tableSubtitle}</p>
                </div>
                <div class="bdd-panel-actions">
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        placeholder="Search Results"
                        value={searchInput}
                        class="bdd-search"
                        onchange={handleSearchChange}
                    ></lightning-input>

                    <lightning-button-icon
                        icon-name="utility:refresh"
                        variant="border-filled"
                        alternative-text="Refresh"
                        aria-label="Refresh"
                        title="Refresh"
                        onclick={handleRefresh}
                    ></lightning-button-icon>

                    <div class="bdd-filter-wrap">
                        <div class={filterTriggerClass}>
                            <lightning-button-icon
                                icon-name="utility:filterList"
                                variant="border-filled"
                                alternative-text="Filter list"
                                aria-label="Filter list"
                                title="Filter list"
                                onclick={toggleFilter}
                            ></lightning-button-icon>
                        </div>

                        <template if:true={isFilterOpen}>
                            <section class="bdd-filter-popover">
                                <div class="bdd-filter-field">
                                    <lightning-combobox
                                        name="ownership"
                                        label="Ownership"
                                        value={draftFilterValues.ownership}
                                        options={ownershipOptions}
                                        onchange={handleFilterChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="bdd-filter-field">
                                    <lightning-combobox
                                        name="status"
                                        label="Consent Status"
                                        value={draftFilterValues.status}
                                        options={statusOptions}
                                        onchange={handleFilterChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="bdd-filter-field">
                                    <lightning-combobox
                                        name="dateType"
                                        label="Date Type"
                                        value={draftFilterValues.dateType}
                                        options={dateTypeOptions}
                                        onchange={handleFilterChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="bdd-filter-field">
                                    <lightning-combobox
                                        name="dateRange"
                                        label="Date Range"
                                        value={draftFilterValues.dateRange}
                                        options={dateRangeOptions}
                                        onchange={handleDateRangeChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="bdd-filter-field">
                                    <lightning-input
                                        type="date"
                                        label="Start Date"
                                        value={draftFilterValues.startDate}
                                        disabled={dateInputsDisabled}
                                        onchange={handleStartDateChange}
                                    ></lightning-input>
                                </div>
                                <div class="bdd-filter-field">
                                    <lightning-input
                                        type="date"
                                        label="End Date"
                                        value={draftFilterValues.endDate}
                                        disabled={dateInputsDisabled}
                                        onchange={handleEndDateChange}
                                    ></lightning-input>
                                </div>
                                <div class="bdd-filter-footer">
                                    <lightning-button
                                        label="Clear All"
                                        variant="neutral"
                                        onclick={clearFilters}
                                    ></lightning-button>
                                    <lightning-button label="Apply" variant="brand" onclick={applyFilters}></lightning-button>
                                </div>
                            </section>
                        </template>
                    </div>
                </div>
            </div>

            <div class="bdd-table-wrap">
                <template if:true={loading}>
                    <div class="bdd-spinner-overlay">
                        <lightning-spinner size="medium" alternative-text="Loading"></lightning-spinner>
                    </div>
                </template>

                <template if:true={showEmpty}>
                    <div class="bdd-empty-state">
                        <lightning-icon icon-name="utility:info" size="large" alternative-text=""></lightning-icon>
                        <p class="bdd-empty-title">No departure records found</p>
                        <p class="bdd-empty-text">Try another search keyword or adjust filters.</p>
                    </div>
                </template>

                <template if:false={showEmpty}>
                    <div class="bdd-datatable-scroll">
                        <lightning-datatable
                            key-field="id"
                            data={departures}
                            columns={columns}
                            onsort={handleSort}
                            onrowaction={handleRowAction}
                            hide-checkbox-column
                            sorted-by={sortedBy}
                            sorted-direction={sortDirection}
                        ></lightning-datatable>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <c-batch-departure-upload-modal onsuccess={handleUploadSuccess}></c-batch-departure-upload-modal>
</template>
